services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-truck-signs-api:local}
    restart: unless-stopped
    env_file: .env
    environment:
      MODE: prod
      DEBUG_ENABLED: "False"
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8020:8000"
    volumes:
      - staticfiles_data:/app/src/staticfiles
      - mediafiles_data:/app/src/mediafiles
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  staticfiles_data:
  mediafiles_data:
