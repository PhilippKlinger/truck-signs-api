name: Lint and Test Python Code Base

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read

# Pin actions to exact commits; comments show their readable versions.
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up Python 3.12
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: "3.12"
            - name: Install Dependencies
              run: |
                  pip install -r requirements.txt
            - name: Lint and Check Formatting
              run: |
                  echo "Running flake8 and black"
                  flake8 .
                  black --check .
                  isort --check-only .

    test:
        runs-on: ubuntu-latest
        needs: lint
        env:
            MODE: dev
            # Use a temporary key because Django requires one for tests.
            SECRET_KEY: ci-${{ github.sha }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up Python 3.12
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: "3.12"
            - name: Install Dependencies
              run: |
                  pip install -r requirements.txt
            - name: Run Django Tests
              working-directory: src
              run: |
                  python manage.py test --verbosity=2
